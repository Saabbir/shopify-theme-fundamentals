<svg viewBox="0 0 1180 820" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Annotated Figma mockup mapped to font roles</title>
  <desc>A hero mockup with an eyebrow label, headline, body paragraph, pull quote, and CTA button, each annotated with a numbered callout showing its font role, family, weight, size, line-height, and letter-spacing.</desc>

  <rect x="0" y="0" width="1180" height="820" fill="#f3f3f0"/>
  <rect x="10" y="10" width="1160" height="800" rx="16" fill="#ffffff" stroke="#e2e2e2" stroke-width="1.5"/>

  <text x="40" y="46" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#1a1a1a">Reading a Figma mockup &#8594; font roles</text>
  <text x="40" y="70" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#666">Numbered callouts correspond to rows in the inventory table in the article.</text>

  <!-- Mockup card -->
  <rect x="40" y="96" width="560" height="660" rx="14" fill="#ffffff" stroke="#ddd" stroke-width="1.5"/>

  <!-- 1. Eyebrow -->
  <text x="80" y="150" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#444">NEW ARRIVAL</text>

  <!-- 2. Headline -->
  <text x="80" y="232" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#1a1a1a">Built for Quiet</text>
  <text x="80" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#1a1a1a">Mornings</text>

  <!-- 3. Body paragraph -->
  <text x="80" y="349" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#333">This chair was designed around one idea &#8212;</text>
  <text x="80" y="375" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#333">comfort that doesn't need to announce itself,</text>
  <text x="80" y="401" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#333">morning after morning.</text>

  <!-- 4. Pull quote -->
  <text x="80" y="472" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" fill="#555">&#8220;The kind of chair you forget&#8221;</text>
  <text x="80" y="501" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" fill="#555">you're sitting in.&#8221;</text>

  <!-- 5. CTA -->
  <rect x="80" y="592" width="240" height="44" rx="4" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="200" y="619" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#333">SHOP THE COLLECTION</text>

  <!-- Callout 1: Eyebrow -> Body role (bold) -->
  <circle cx="600" cy="150" r="13" fill="#2457a6"/>
  <text x="600" y="154" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">1</text>
  <line x1="613" y1="150" x2="660" y2="150" stroke="#2457a6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="660" y="128" width="480" height="94" rx="10" fill="#fafafa" stroke="#ddd"/>
  <rect x="660" y="136" width="5" height="78" fill="#2457a6"/>
  <text x="684" y="150" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Eyebrow label &#8212; Body role (bold)</text>
  <text x="684" y="168" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#555">Font: <tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#111">Inter, 600</tspan></text>
  <text x="684" y="184" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#555">Size: <tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#111">13px</tspan>  Line-height: <tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#111">16px &#8594; 1.23</tspan></text>
  <text x="684" y="200" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#555">Letter-spacing: <tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#111">2px &#8594; 0.15em</tspan></text>

  <!-- Callout 2: Headline -> Heading role -->
  <circle cx="600" cy="258" r="13" fill="#b5651d"/>
  <text x="600" y="262" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">2</text>
  <line x1="613" y1="258" x2="660" y2="258" stroke="#b5651d" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="660" y="236" width="480" height="94" rx="10" fill="#fafafa" stroke="#ddd"/>
  <rect x="660" y="244" width="5" height="78" fill="#b5651d"/>
  <text x="684" y="258" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Headline &#8212; Heading role</text>
  <text x="684" y="276" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#555">Font: <tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#111">Canela, 600</tspan></text>
  <text x="684" y="292" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#555">Size: <tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#111">46px desktop &#8594; 28px mobile</tspan></text>
  <text x="684" y="308" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#555">Line-height: <tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#111">52px &#8594; 1.13</tspan>, clamp() endpoints</text>

  <!-- Callout 3: Body copy -> Body role (normal) -->
  <circle cx="600" cy="375" r="13" fill="#2457a6"/>
  <text x="600" y="379" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">3</text>
  <line x1="613" y1="375" x2="660" y2="375" stroke="#2457a6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="660" y="353" width="480" height="94" rx="10" fill="#fafafa" stroke="#ddd"/>
  <rect x="660" y="361" width="5" height="78" fill="#2457a6"/>
  <text x="684" y="375" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Body copy &#8212; Body role (normal)</text>
  <text x="684" y="393" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#555">Font: <tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#111">Inter, 400</tspan></text>
  <text x="684" y="409" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#555">Size: <tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#111">16px</tspan>  Line-height: <tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#111">26px &#8594; 1.6</tspan></text>
  <text x="684" y="425" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#555">Letter-spacing: <tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#111">0</tspan></text>

  <!-- Callout 4: Pull quote -> Accent role -->
  <circle cx="600" cy="486" r="13" fill="#7a3fa0"/>
  <text x="600" y="490" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">4</text>
  <line x1="613" y1="486" x2="660" y2="486" stroke="#7a3fa0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="660" y="464" width="480" height="94" rx="10" fill="#fafafa" stroke="#ddd"/>
  <rect x="660" y="472" width="5" height="78" fill="#7a3fa0"/>
  <text x="684" y="486" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Pull quote &#8212; Accent role (italic)</text>
  <text x="684" y="504" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#555">Font: <tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#111">Canela, 400 italic</tspan></text>
  <text x="684" y="520" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#555">Size: <tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#111">21px</tspan>  Line-height: <tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#111">29px &#8594; 1.4</tspan></text>
  <text x="684" y="536" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#555">A separate role, not a Heading variant &#8212; it's a distinct voice.</text>

  <!-- Callout 5: CTA label -> Body role (bold) -->
  <circle cx="600" cy="614" r="13" fill="#2457a6"/>
  <text x="600" y="618" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">5</text>
  <line x1="613" y1="614" x2="660" y2="614" stroke="#2457a6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="660" y="592" width="480" height="94" rx="10" fill="#fafafa" stroke="#ddd"/>
  <rect x="660" y="600" width="5" height="78" fill="#2457a6"/>
  <text x="684" y="614" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">CTA label &#8212; Body role (bold)</text>
  <text x="684" y="632" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#555">Font: <tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#111">Inter, 600</tspan> (same as &#9312;)</text>
  <text x="684" y="648" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#555">Letter-spacing: <tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#111">1.8px &#8594; 0.14em</tspan></text>
  <text x="684" y="664" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#555">No new variant loaded &#8212; reuses the Body-bold from &#9312;.</text>

  <!-- Legend -->
  <circle cx="60" cy="790" r="7" fill="#2457a6"/>
  <text x="74" y="795" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#333">Body role</text>
  <circle cx="190" cy="790" r="7" fill="#b5651d"/>
  <text x="204" y="795" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#333">Heading role</text>
  <circle cx="340" cy="790" r="7" fill="#7a3fa0"/>
  <text x="354" y="795" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#333">Accent role</text>
</svg>
